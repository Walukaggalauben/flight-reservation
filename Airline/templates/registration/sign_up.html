{% load static crispy_forms_tags %}

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="{% static 'admin/css/styles.css' %}">

{% block content %}
<div class="container text-center mt-5">
    <img id="logo" class="mb-3" src="{% static 'img/aviones_logo.png' %}" alt="Logo">
    <h2 class="mb-4">Sign Up</h2>
    <form method="post" class="d-inline-block text-start" style="max-width: 400px;">
        {% csrf_token %}
        {{ form|crispy }}
        <button type="submit" class="btn btn-primary w-100 mt-2">Sign Up</button>
    </form>
</div>
{% endblock %}
