{% load static crispy_forms_tags %}

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="{% static 'admin/css/styles.css' %}">

<body style="background-color: rgba(64, 152, 224, 1); height: 100vh; display: flex; justify-content: center; align-items: center; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">

<div class="container text-center mt-5">
    <img id="logo" class="mb-3" src="{% static 'img/aviones_logo.png' %}" alt="Logo">
    <h2 class="mb-4">SIGN UP</h2>

    <form method="post" class="d-inline-block text-start" style="max-width: 400px;">
        {% csrf_token %}
        {{ form|crispy }}

        <button type="submit" class="btn btn-primary w-100 mt-2">SIGN UP</button>
    </form>

    <div class="mt-3">
        <a href="{% url 'login_page' %}">Have Account?Login</a>
    </div>
</div>
